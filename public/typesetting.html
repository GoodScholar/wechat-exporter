<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留篇 · 公众号排版</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/typesetting-theme.css"><script src="/typesetting.js" defer></script></head>
<body class="typesetting-page">
  <header class="topbar"><a class="brand" href="/"><span class="brand-icon" aria-hidden="true">留</span><strong>留篇</strong></a><nav class="product-nav" aria-label="产品导航"><a href="/">文章导出</a><a href="/typesetting" aria-current="page">公众号排版</a></nav><span class="local-badge"><i></i> 本机运行</span></header>
  <main class="typesetting-workbench"><section class="typesetting-editor" aria-label="排版文稿编辑器"><div class="typesetting-heading"><div><p class="eyebrow">当前文稿</p><h1>公众号排版</h1></div><p id="save-status" role="status">已保存</p></div><form id="article-import" class="article-import"><label>导入公众号文章链接<input id="import-url" type="url" inputmode="url" placeholder="https://mp.weixin.qq.com/s/..." autocomplete="off"></label><button type="submit" class="secondary">导入文章</button></form><p id="import-message" class="import-message" role="alert"></p><div class="metadata-fields"><label>标题<input id="document-title" type="text" autocomplete="off"></label><label>作者<input id="document-author" type="text" autocomplete="off"></label><label>公众号名称<input id="document-account" type="text" autocomplete="off"></label><label>发布日期<input id="document-published-at" type="date"></label></div><fieldset class="theme-settings"><legend>主题设置</legend><label>主题<select id="document-theme"><option value="default">默认</option><option value="grace">雅致</option><option value="simple">简洁</option></select></label><label>主色<select id="theme-primary-color"><option value="#0F4C81">深蓝</option><option value="#009874">青绿</option><option value="#FA5151">红色</option><option value="#FECE00">黄色</option><option value="#92617E">灰紫</option><option value="#55C9EA">天蓝</option><option value="#B76E79">玫瑰金</option><option value="#556B2F">橄榄绿</option><option value="#333333">深灰</option><option value="#A9A9A9">浅灰</option><option value="#FFB7C5">粉色</option></select></label><label>字号<select id="theme-font-size"><option value="14px">14px</option><option value="15px">15px</option><option value="16px">16px</option><option value="17px">17px</option><option value="18px">18px</option></select></label><label>行距<select id="theme-line-height"><option value="1.5">1.5</option><option value="1.65">1.65</option><option value="1.75">1.75</option><option value="1.9">1.9</option><option value="2.05">2.05</option></select></label><label>段间距<select id="theme-block-spacing"><option value="0.75">0.75</option><option value="0.9">0.9</option><option value="1">1</option><option value="1.15">1.15</option><option value="1.35">1.35</option></select></label><button id="reset-theme" type="button" class="secondary">恢复当前主题默认值</button></fieldset><label class="body-field">Markdown 正文<textarea id="document-body" spellcheck="false" placeholder="在这里撰写正文…"></textarea></label><p id="rich-text-message" class="rich-text-message" role="alert"></p><p id="save-message" class="save-message" role="alert"></p></section><section class="typesetting-proof" aria-label="默认主题预览"><div class="proof-heading"><div><p class="eyebrow">默认主题</p><h2>实时预览</h2></div></div><article id="preview" class="typeset-preview"><p class="preview-empty">正文为空</p></article></section></main>
</body></html>
