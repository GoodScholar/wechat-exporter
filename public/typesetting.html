<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留篇 · 公众号排版</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/typesetting-theme.css"><script src="/typesetting.js" defer></script></head>
<body class="typesetting-page">
  <header class="topbar"><a class="brand" href="/"><span class="brand-icon" aria-hidden="true">留</span><strong>留篇</strong></a><nav class="product-nav" aria-label="产品导航"><a href="/">文章导出</a><a href="/typesetting" aria-current="page">公众号排版</a></nav><span class="local-badge"><i></i> 本机运行</span></header>
  <main class="typesetting-workbench">
    <section class="typesetting-editor" aria-label="排版文稿编辑器">
      <div class="typesetting-heading"><div><p class="eyebrow">当前文稿</p><h1>公众号排版</h1></div><p id="save-status" role="status">已保存</p></div>
      <form id="article-import" class="article-import"><label>导入公众号文章链接<input id="import-url" type="url" inputmode="url" placeholder="https://mp.weixin.qq.com/s/..." autocomplete="off"></label><button type="submit" class="secondary">导入文章</button></form>
      <p id="import-message" class="import-message" role="alert"></p>
      <div class="metadata-fields">
        <div class="metadata-field"><label for="document-title">标题</label><div class="metadata-control"><input id="document-title" type="text" autocomplete="off"><button type="button" class="secondary metadata-copy" data-copy-field="title">复制标题</button></div></div>
        <div class="metadata-field"><label for="document-author">作者</label><div class="metadata-control"><input id="document-author" type="text" autocomplete="off"><button type="button" class="secondary metadata-copy" data-copy-field="author">复制作者</button></div></div>
        <div class="metadata-field"><label for="document-account">公众号名称</label><div class="metadata-control"><input id="document-account" type="text" autocomplete="off"><button type="button" class="secondary metadata-copy" data-copy-field="account">复制公众号名称</button></div></div>
        <div class="metadata-field"><label for="document-published-at">发布日期</label><div class="metadata-control"><input id="document-published-at" type="date"><button type="button" class="secondary metadata-copy" data-copy-field="publishedAt">复制发布日期</button></div></div>
      </div>
      <fieldset class="theme-settings"><legend>主题设置</legend><label>主题<select id="document-theme"><option value="default">默认</option><option value="grace">雅致</option><option value="simple">简洁</option></select></label><label>主色<select id="theme-primary-color"><option value="#0F4C81">深蓝</option><option value="#009874">青绿</option><option value="#FA5151">红色</option><option value="#FECE00">黄色</option><option value="#92617E">灰紫</option><option value="#55C9EA">天蓝</option><option value="#B76E79">玫瑰金</option><option value="#556B2F">橄榄绿</option><option value="#333333">深灰</option><option value="#A9A9A9">浅灰</option><option value="#FFB7C5">粉色</option></select></label><label>字号<select id="theme-font-size"><option value="14px">14px</option><option value="15px">15px</option><option value="16px">16px</option><option value="17px">17px</option><option value="18px">18px</option></select></label><label>行距<select id="theme-line-height"><option value="1.5">1.5</option><option value="1.65">1.65</option><option value="1.75">1.75</option><option value="1.9">1.9</option><option value="2.05">2.05</option></select></label><label>段间距<select id="theme-block-spacing"><option value="0.75">0.75</option><option value="0.9">0.9</option><option value="1">1</option><option value="1.15">1.15</option><option value="1.35">1.35</option></select></label><button id="reset-theme" type="button" class="secondary">恢复当前主题默认值</button></fieldset>
      <label class="document-option"><input id="convert-external-links" type="checkbox">外链转脚注</label>
      <label class="body-field">Markdown 正文<textarea id="document-body" spellcheck="false" placeholder="在这里撰写正文…"></textarea></label>
      <fieldset class="output-controls"><legend>输出</legend><div class="output-actions"><button id="copy-wechat" type="button" class="output-primary">复制到微信</button><button id="copy-markdown" type="button" class="secondary">复制 Markdown</button><button id="download-html" type="button" class="secondary">下载 HTML</button><button id="download-markdown" type="button" class="secondary">下载 Markdown</button></div><p id="output-status" role="status"></p><p id="output-error" role="alert"></p></fieldset>
      <p id="rich-text-message" class="rich-text-message" role="alert"></p><p id="save-message" class="save-message" role="alert"></p>
    </section>
    <section class="typesetting-proof" aria-label="排版预览与格式检查">
      <div class="proof-heading"><div><p class="eyebrow">当前主题</p><h2>实时预览</h2></div><p id="render-status" role="status" data-state="checking" data-blocked="unknown">正在重新检查</p></div>
      <article id="preview" class="typeset-preview"><p class="preview-empty">正文为空</p></article>
      <section id="format-checks" class="format-checks" aria-label="格式检查" aria-busy="true">
        <h2>格式检查</h2>
        <section class="format-check-group" data-check-severity="blocker"><div class="format-check-heading"><h3>阻断问题</h3><span data-check-count>0</span></div><div data-check-list><p class="format-check-empty">暂无</p></div></section>
        <section class="format-check-group" data-check-severity="conversion"><div class="format-check-heading"><h3>已执行转换</h3><span data-check-count>0</span></div><div data-check-list><p class="format-check-empty">暂无</p></div></section>
        <section class="format-check-group" data-check-severity="advisory"><div class="format-check-heading"><h3>建议复核</h3><span data-check-count>0</span></div><div data-check-list><p class="format-check-empty">暂无</p></div></section>
      </section>
    </section>
  </main>
</body></html>
