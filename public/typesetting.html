<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留篇 · 公众号排版</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/typesetting-theme.css"><script src="/typesetting.js" defer></script></head>
<body class="typesetting-page">
  <header class="topbar"><a class="brand" href="/"><span class="brand-icon" aria-hidden="true">留</span><strong>留篇</strong></a><nav class="product-nav" aria-label="产品导航"><a href="/">文章导出</a><a href="/typesetting" aria-current="page">公众号排版</a></nav><span class="local-badge"><i></i> 本机运行</span></header>
  <main class="typesetting-workbench"><section class="typesetting-editor" aria-label="排版文稿编辑器"><div class="typesetting-heading"><div><p class="eyebrow">当前文稿</p><h1>公众号排版</h1></div><p id="save-status" role="status">已保存</p></div><form id="article-import" class="article-import"><label>导入公众号文章链接<input id="import-url" type="url" inputmode="url" placeholder="https://mp.weixin.qq.com/s/..." autocomplete="off"></label><button type="submit" class="secondary">导入文章</button></form><p id="import-message" class="import-message" role="alert"></p><div class="metadata-fields"><label>标题<input id="document-title" type="text" autocomplete="off"></label><label>作者<input id="document-author" type="text" autocomplete="off"></label><label>公众号名称<input id="document-account" type="text" autocomplete="off"></label><label>发布日期<input id="document-published-at" type="date"></label></div><label class="body-field">Markdown 正文<textarea id="document-body" spellcheck="false" placeholder="在这里撰写正文…"></textarea></label><p id="save-message" class="save-message" role="alert"></p></section><section class="typesetting-proof" aria-label="默认主题预览"><div class="proof-heading"><div><p class="eyebrow">默认主题</p><h2>实时预览</h2></div></div><article id="preview" class="typeset-preview"><p class="preview-empty">正文为空</p></article></section></main>
